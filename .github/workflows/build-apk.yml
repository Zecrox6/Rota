name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Installer Java (nécessaire pour Gradle)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Installer les dépendances
        run: npm install

      - name: Build du site (Vite)
        run: npm run build

      - name: Ajouter la plateforme Android
        run: npx cap add android

      - name: Générer les icônes de l'app
        run: npx capacitor-assets generate --android

      - name: Rendre gradlew exécutable
        run: chmod +x android/gradlew

      - name: Compiler l'APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Publier l'APK comme fichier téléchargeable
        uses: actions/upload-artifact@v4
        with:
          name: rota-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
